[project]
name = "rtxmodelforge"
version = "0.1.0"
description = "RTX Model Forge: Compile e rode modelos LLM otimizados com TensorRT-LLM em GPUs RTX."
readme = "README.md"
authors = [{name = "Kelvin", email = "kelvin@example.com"}]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.1",
    "rich>=13.9.4",
    "questionary>=2.0",
    "pydantic>=2.10.6",
    "pydantic-settings[toml]>=2.7.1",
    "httpx>=0.28.1",
    "pynvml>=12.0.0",
    "huggingface-hub>=0.28.1",
    "tomli-w>=1.2.0",
    "transformers>=4.48.3",
    "tensorrt_llm>=1.3.0rc10",
    "torch==2.10.0+cu130",
    "torchvision==0.25.0+cu130",
]

[project.scripts]
rtxforge = "rtxmodelforge.main:app"
format = "rtxmodelforge.scripts.format:run"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.15.0",
    "mypy>=1.15.0",
    "ruff>=0.9.6",
    "pyright>=1.1.393",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
tensorrt_llm = { index = "nvidia" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "ARG"]
ignore = ["ARG001", "E501"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"
reportMissingImports = false
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=rtxmodelforge",
    "--cov-report=term-missing",
    "--cov-report=html",
    "-v",
]

[tool.coverage.run]
source = ["rtxmodelforge"]
omit = [
    "*/tests/*",
    "*/scripts/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
    "except ImportError:",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
