[project]
name = "rtxmodelforge"
version = "0.1.0"
description = "RTX Model Forge: Compile e rode modelos LLM otimizados com TensorRT-LLM em GPUs RTX."
readme = "README.md"
authors = [{name = "Kelvin", email = "kelvin@example.com"}]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "rich>=14.0",
    "pydantic>=2.10",
    "pydantic-settings[toml]>=2.7",
    "httpx>=0.28",
    "pynvml>=12.0",
    "huggingface-hub>=0.28",
    "tomli-w>=1.1",
    "transformers>=4.48",
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[project.scripts]
rtxforge = "rtxmodelforge.main:app"
# Comando para formatar e tipar (uv run format)
format = "rtxmodelforge.scripts.format:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "mypy>=1.13",
    "ruff>=0.9",
    "pyright>=1.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "ARG"]
ignore = ["ARG001"] # Ignorar argumentos não usados em callbacks Typer

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
reportMissingImports = false
reportMissingTypeStubs = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
