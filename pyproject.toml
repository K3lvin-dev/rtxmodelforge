[project]
name = "rtxmodelforge"
version = "0.1.0"
description = "RTX Model Forge: Compile e rode modelos LLM otimizados com TensorRT-LLM em GPUs RTX."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "rich>=14.0",
    "pydantic>=2.10",
    "pydantic-settings[toml]>=2.7",
    "httpx>=0.28",
    "pynvml>=12.0",
    "huggingface_hub>=0.28",
    "tomli-w>=1.1",
    "transformers>=4.48",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "mypy>=1.13",
]

[project.scripts]
rtxforge = "rtxmodelforge.main:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
strict = true
python_version = "3.12"
